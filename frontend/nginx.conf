server {
    # $PORT is not available here - nginx has no env substitution in this file
    # by default. Containers that need a platform-assigned port should map it
    # (-p $PORT:80); the ones that health-check a fixed port are fine as is.
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Hashed filenames, so a given asset can never change - safe to cache hard.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is deliberately NOT cached. It is the file that names the
    # hashed assets, so a cached copy pins a browser to an old bundle forever.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Everything falls back to index.html. Nothing depends on this today - the
    # app has no router - but a password-reset link arrives as /?reset=<token>
    # and any unknown path should reach the app rather than nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;

    # The app is served over https by whatever sits in front; these cost
    # nothing and close off the cheapest classes of attack.
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;
    add_header Referrer-Policy        strict-origin-when-cross-origin;
}
