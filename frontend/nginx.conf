server {
  listen       8080;
  server_name  _;
  root         /usr/share/nginx/html;

  # Every unknown path falls back to index.html. The nginx equivalent of
  # _redirects / vercel.json - see the note in public/_redirects for why.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite hashes these filenames, so a given name only ever holds one build.
  # Safe to cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html is the file that NAMES the hashed assets, so it must never be
  # cached - a stale copy would keep pointing at a bundle that no longer exists.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  gzip              on;
  gzip_types        text/css application/javascript image/svg+xml;
  gzip_min_length   1024;
}
