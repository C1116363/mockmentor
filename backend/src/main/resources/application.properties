spring.application.name=interview-mentor

# ---- MySQL ----
# createDatabaseIfNotExist=true means you don't have to create the schema by hand.
# Overridable so the same jar runs locally and on a server. A hosted MySQL
# gives you its own host, port and database name, and none of them are these.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/interview_mentor?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" lets Hibernate create + evolve the tables for you. Great for learning,
# not what you'd use in production (there you'd use Flyway or Liquibase).
# update is right for development and a liability in production: it will not
# drop anything, but it also cannot review what it is about to do. Set
# DDL_AUTO=validate once the schema is created and let it refuse to start
# rather than change a live database under you.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Off in production - every query in the log is noise you pay to store, and
# parameter values can include personal data.
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Server ----
server.port=8080

# Where the React dev server runs (used by SecurityConfig)
# The deployed frontend and website must be listed here or every browser call
# fails CORS. This is the single most common reason a freshly hosted build
# looks completely broken while the API answers curl perfectly.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- JWT ----
# Base64-encoded 256-bit key. In production this comes from an env var or a
# secrets manager, never from a file you commit.
app.jwt.secret=${JWT_SECRET:c3ByaW5nLWJvb3QtbGVhcm5pbmctcHJvamVjdC1qd3Qtc2lnbmluZy1rZXktMzJiKw==}
# 24 hours
app.jwt.expiration-ms=86400000

# ---- Swagger / OpenAPI ----
# Swagger UI:  http://localhost:8080/swagger-ui.html
# Raw spec:    http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Group endpoints by controller and keep them in a stable order.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
# Don't make people paste "Bearer " manually - the Authorize dialog handles it.
springdoc.swagger-ui.persist-authorization=true

# ---- Meeting links ----
# "jitsi"  - a room is created automatically when a mentor is assigned. Works
#            with no API keys, and both people join by opening the same URL.
# "google" - real Google Meet links. NOT implemented: it needs the Google
#            Calendar API with OAuth credentials. See GoogleMeetLinkGenerator.
app.meeting.provider=jitsi
app.meeting.base-url=https://meet.jit.si

# ---- Where the frontend lives ----
# Used to build the password-reset link in the email. It has to point at the
# React app, not at this API: the link is clicked by a person and needs to land
# on a page with a password box, not on raw JSON.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---- Email ----
# "log"  - writes the email to this console instead of sending it. The default,
#          so forgot-password works on a fresh clone with no setup: you copy the
#          reset link out of the backend log. NOT for a real server - a reset
#          link in a log file is a working account takeover.
# "smtp" - real email. Works with Gmail, which needs an App Password (not your
#          Google password - see SmtpMailer for the three steps).
app.mail.provider=${MAIL_PROVIDER:log}
app.mail.from=${MAIL_FROM:}

# Only read when app.mail.provider=smtp. These are Gmail's settings; another
# provider changes only these four lines and nothing in the code.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Without this a dead SMTP host hangs the request thread until the OS gives up,
# which on a login-adjacent endpoint is how one broken dependency becomes an
# outage. Ten seconds is far longer than a healthy send takes.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ---- Which payment provider ----
# "manual"   - the student pays our UPI ID from their own app and uploads a
#              screenshot; an admin checks it against the bank. The default.
#              Costs 0%, needs no KYC, no account and no approval wait, and the
#              money arrives instantly rather than on T+2. It is also the way to
#              take money on a day the gateway is down, which is why the code
#              keeps it working alongside a gateway rather than replacing it.
# "razorpay" - real card / netbanking / UPI checkout. Needs the three keys
#              below. Selecting it without them does NOT break the app: the
#              payment screen notices and offers manual UPI instead.
app.payment.provider=${PAYMENT_PROVIDER:manual}

# ---- Razorpay keys ----
#
#   >>> PUT THE ACTUAL VALUES IN backend/.env, NOT HERE. <<<
#
# This file is committed to git. .env is not (see .gitignore), which is the
# whole point of the ${VAR:default} indirection - the names live in the repo,
# the secrets live on the machine.
#
# Where each one comes from, once you have registered:
#
#   RAZORPAY_KEY_ID       Dashboard -> Account & Settings -> API Keys ->
#                         Generate Key. Starts "rzp_test_" or "rzp_live_".
#                         Publishable: it is sent to the browser by design.
#
#   RAZORPAY_KEY_SECRET   Shown ONCE, next to the Key ID, at the moment you
#                         generate it. Nowhere else, ever - if you lose it you
#                         regenerate the pair. Server only.
#
#   RAZORPAY_WEBHOOK_SECRET
#                         Dashboard -> Settings -> Webhooks -> Add New Webhook.
#                         YOU choose this string; it is not generated for you.
#                         A DIFFERENT secret from the key secret - putting the
#                         key secret here gives a stream of rejected webhooks
#                         that looks like an attack. Set the URL to
#                         https://your-domain/api/webhooks/razorpay and tick
#                         order.paid, payment.captured and payment.failed.
#
# Razorpay cannot reach localhost, so in development put a tunnel in front:
#   cloudflared tunnel --url http://localhost:8080
# and use the https URL it prints as the webhook URL.
app.payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# ---- Manual UPI payment (v1: no gateway) ----
# Change this to your own UPI ID before taking real money.
app.payment.upi-id=${UPI_ID:confirmplacement@okhdfcbank}
app.payment.payee-name=${UPI_PAYEE:ConfirmPlacement}
app.payment.amount=499.00

# Where payment screenshots are stored. Outside the repo, and gitignored.
app.uploads.dir=${UPLOAD_ROOT:./uploads}/payments

# Where study material files are stored. Also outside the repo - these are
# served only through an endpoint that checks who is asking, never as static
# files, so they must not sit anywhere a web server would hand them out.
app.materials.dir=${UPLOAD_ROOT:./uploads}/materials

# ---- Upload limits ----
# This is the HARD cap Tomcat enforces before a request ever reaches a
# controller, so it has to be the largest any feature needs: study material at
# 25 MB. Each feature then applies its own tighter limit in code - screenshots
# stay capped at 5 MB inside ScreenshotStorage. Going over this returns 413;
# going over a feature's own limit returns 400.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Where candidate CVs are stored. Outside the repo, and served only through an
# endpoint that checks who is asking - a CV carries a phone number and an
# address, so it must not sit anywhere a web server would hand it out.
app.cv.dir=${UPLOAD_ROOT:./uploads}/cvs

# ---- Live project access (GitHub) ----
# "manual" - we record who should have access and an admin adds them on GitHub.
#            The default, and a defensible one: push access to a private repo is
#            worth a person looking at, and it keeps a repo-admin token out of
#            the application's environment entirely.
# "api"    - real GitHub API invites. NOT IMPLEMENTED; fails loudly rather than
#            silently telling a paying student they have access. See
#            github/GitHubApiCollaboratorGranter for the full contract.
app.github.provider=manual
app.github.token=${GITHUB_TOKEN:}

# ---- Error responses ----
# Belt and braces. GlobalExceptionHandler catches Exception itself, so Boot's
# own error page should never be reached - but if one ever slips past (an error
# thrown by a filter, or during startup), these make sure it cannot leak a stack
# trace or an exception class name to the caller.
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

# Unknown URLs raise NoResourceFoundException, which GlobalExceptionHandler turns
# into a real 404 body. (Deliberately NOT setting spring.web.resources
# .add-mappings=false here - Swagger UI is served through the static resource
# handler, so switching that off takes the docs down with it.)
spring.mvc.throw-exception-if-no-handler-found=true
