spring.application.name=interview-mentor

# ---- MySQL ----
# createDatabaseIfNotExist=true means you don't have to create the schema by hand.
spring.datasource.url=jdbc:mysql://localhost:3306/interview_mentor?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" lets Hibernate create + evolve the tables for you. Great for learning,
# not what you'd use in production (there you'd use Flyway or Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Server ----
server.port=8080

# Where the React dev server runs (used by SecurityConfig)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- JWT ----
# Base64-encoded 256-bit key. In production this comes from an env var or a
# secrets manager, never from a file you commit.
app.jwt.secret=${JWT_SECRET:c3ByaW5nLWJvb3QtbGVhcm5pbmctcHJvamVjdC1qd3Qtc2lnbmluZy1rZXktMzJiKw==}
# 24 hours
app.jwt.expiration-ms=86400000

# ---- Swagger / OpenAPI ----
# Swagger UI:  http://localhost:8080/swagger-ui.html
# Raw spec:    http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Group endpoints by controller and keep them in a stable order.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
# Don't make people paste "Bearer " manually - the Authorize dialog handles it.
springdoc.swagger-ui.persist-authorization=true

# ---- Meeting links ----
# "jitsi"  - a room is created automatically when a mentor is assigned. Works
#            with no API keys, and both people join by opening the same URL.
# "google" - real Google Meet links. NOT implemented: it needs the Google
#            Calendar API with OAuth credentials. See GoogleMeetLinkGenerator.
app.meeting.provider=jitsi
app.meeting.base-url=https://meet.jit.si

# ---- Manual UPI payment (v1: no gateway) ----
# Change this to your own UPI ID before taking real money.
app.payment.upi-id=${UPI_ID:prehire@okhdfcbank}
app.payment.payee-name=${UPI_PAYEE:PreHire}
app.payment.amount=499.00

# Where payment screenshots are stored. Outside the repo, and gitignored.
app.uploads.dir=./uploads/payments

# Screenshot upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
