spring.application.name=interview-mentor

# ---- MySQL ----
# createDatabaseIfNotExist=true means you don't have to create the schema by hand.
spring.datasource.url=jdbc:mysql://localhost:3306/interview_mentor?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" lets Hibernate create + evolve the tables for you. Great for learning,
# not what you'd use in production (there you'd use Flyway or Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- Server ----
server.port=8080

# Where the React dev server runs (used by SecurityConfig)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- JWT ----
# Base64-encoded 256-bit key. In production this comes from an env var or a
# secrets manager, never from a file you commit.
app.jwt.secret=${JWT_SECRET:c3ByaW5nLWJvb3QtbGVhcm5pbmctcHJvamVjdC1qd3Qtc2lnbmluZy1rZXktMzJiKw==}
# 24 hours
app.jwt.expiration-ms=86400000

# ---- Swagger / OpenAPI ----
# Swagger UI:  http://localhost:8080/swagger-ui.html
# Raw spec:    http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Group endpoints by controller and keep them in a stable order.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
# Don't make people paste "Bearer " manually - the Authorize dialog handles it.
springdoc.swagger-ui.persist-authorization=true

# ---- Meeting links ----
# "jitsi"  - a room is created automatically when a mentor is assigned. Works
#            with no API keys, and both people join by opening the same URL.
# "google" - real Google Meet links. NOT implemented: it needs the Google
#            Calendar API with OAuth credentials. See GoogleMeetLinkGenerator.
app.meeting.provider=jitsi
app.meeting.base-url=https://meet.jit.si

# ---- Manual UPI payment (v1: no gateway) ----
# Change this to your own UPI ID before taking real money.
app.payment.upi-id=${UPI_ID:prehire@okhdfcbank}
app.payment.payee-name=${UPI_PAYEE:PreHire}
app.payment.amount=499.00

# Where payment screenshots are stored. Outside the repo, and gitignored.
app.uploads.dir=./uploads/payments

# Where study material files are stored. Also outside the repo - these are
# served only through an endpoint that checks who is asking, never as static
# files, so they must not sit anywhere a web server would hand them out.
app.materials.dir=./uploads/materials

# ---- Upload limits ----
# This is the HARD cap Tomcat enforces before a request ever reaches a
# controller, so it has to be the largest any feature needs: study material at
# 25 MB. Each feature then applies its own tighter limit in code - screenshots
# stay capped at 5 MB inside ScreenshotStorage. Going over this returns 413;
# going over a feature's own limit returns 400.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# ---- Live project access (GitHub) ----
# "manual" - we record who should have access and an admin adds them on GitHub.
#            The default, and a defensible one: push access to a private repo is
#            worth a person looking at, and it keeps a repo-admin token out of
#            the application's environment entirely.
# "api"    - real GitHub API invites. NOT IMPLEMENTED; fails loudly rather than
#            silently telling a paying student they have access. See
#            github/GitHubApiCollaboratorGranter for the full contract.
app.github.provider=manual
app.github.token=${GITHUB_TOKEN:}

# ---- Error responses ----
# Belt and braces. GlobalExceptionHandler catches Exception itself, so Boot's
# own error page should never be reached - but if one ever slips past (an error
# thrown by a filter, or during startup), these make sure it cannot leak a stack
# trace or an exception class name to the caller.
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never

# Unknown URLs raise NoResourceFoundException, which GlobalExceptionHandler turns
# into a real 404 body. (Deliberately NOT setting spring.web.resources
# .add-mappings=false here - Swagger UI is served through the static resource
# handler, so switching that off takes the docs down with it.)
spring.mvc.throw-exception-if-no-handler-found=true
