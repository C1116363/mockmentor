# The whole application on one machine.
#
#   cp .env.deploy.example .env      # fill in the three secrets
#   docker compose up -d --build
#
# For a VPS, or for testing the real production build before you push it to a
# platform. Not needed for a managed host - there you point the platform at
# backend/Dockerfile and let it run the container.

services:
  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: interview_mentor
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      # Named volume, so the database survives `docker compose down`.
      # Without this, every restart is a fresh empty database.
      - db-data:/var/lib/mysql
    healthcheck:
      # The backend depends on this passing. MySQL accepts TCP connections
      # several seconds before it will answer a query, so waiting on the port
      # alone gives the backend a connection that immediately fails.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    # Not published. Nothing outside this compose network has any business
    # reaching the database, and publishing 3306 is how a database ends up
    # exposed to the internet by accident.

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # `db` is the service name above - compose resolves it on its own network.
      DATABASE_URL: jdbc:mysql://db:3306/interview_mentor?serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - openssl rand -base64 32}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
      UPLOAD_ROOT: /data/uploads
      SHOW_SQL: "false"
      # update on the first run creates the schema. Switch to validate once it
      # exists, so a mismatch stops the container instead of altering a live
      # database.
      DDL_AUTO: ${DDL_AUTO:-update}
      UPI_ID: ${UPI_ID:-yourname@okhdfcbank}
      UPI_PAYEE: ${UPI_PAYEE:-ConfirmPlacement}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      # CVs, payment screenshots and study material. A named volume, because on
      # an ephemeral filesystem every uploaded file disappears on redeploy while
      # the database rows survive and point at nothing.
      - uploads:/data/uploads
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/public/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time, so this is a build arg rather
        # than an environment variable. Change it and you must rebuild.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:8080"

volumes:
  db-data:
  uploads:
