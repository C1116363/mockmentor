# The whole stack, on any machine that runs Docker.
#
# Two jobs. It deploys the app to a plain VPS with one command, and it lets you
# reproduce a production setup locally - real MySQL, the real jar, nginx in
# front - which is where the difference between "works on my laptop" and "works
# deployed" actually shows up.
#
#   cp .env.deploy.example .env.deploy
#   # fill it in, then:
#   docker compose --env-file .env.deploy up -d --build
#
# Managed platforms (Railway, Render, Fly, Cloud Run) do not use this file -
# they build the Dockerfiles directly and you set the same variables in their
# dashboard.

services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: interview_mentor
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD in your env file}"
    volumes:
      # Named volume, so the database survives `docker compose down`. A bind
      # mount here would also work; what matters is that it is not anonymous,
      # because an anonymous volume is orphaned on every recreate.
      - mysql-data:/var/lib/mysql
    healthcheck:
      # The backend opens its connection pool during startup and fails fast if
      # MySQL is not listening. depends_on alone only waits for the container to
      # exist, which it does long before MySQL accepts connections - so without
      # this the first `up` reliably fails and the second one works.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:mysql://mysql:3306/interview_mentor?serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: "${DB_PASSWORD:?}"
      JWT_SECRET: "${JWT_SECRET:?generate one - openssl rand -base64 32}"
      CORS_ORIGINS: "${CORS_ORIGINS:?}"
      FRONTEND_URL: "${FRONTEND_URL:?}"
      UPLOAD_ROOT: /data/uploads
      # update on the very first run so the schema is created, then switch to
      # validate so it refuses to start on a mismatch instead of altering a
      # live database.
      DDL_AUTO: ${DDL_AUTO:-update}
      SHOW_SQL: "false"
      UPI_ID: ${UPI_ID:-}
      UPI_PAYEE: ${UPI_PAYEE:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      # CVs, payment screenshots and study material. Without this they are
      # inside the container and vanish on every rebuild, while the database
      # rows survive and point at nothing.
      - uploads:/data/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/public/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the bundle at build time, so changing it needs a rebuild -
        # there is nothing in the served files to edit.
        VITE_API_URL: "${VITE_API_URL:?required - e.g. https://api.example.com/api}"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

  website:
    # The marketing page is one static file with no build step, so nginx serves
    # the directory as-is. No image to build.
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./website:/usr/share/nginx/html:ro
    ports:
      - "${WEBSITE_PORT:-3000}:80"

volumes:
  mysql-data:
  uploads:
